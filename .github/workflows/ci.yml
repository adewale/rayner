name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci-scope.ts
      - if: github.event_name == 'pull_request' && steps.scope.outputs.full == 'false'
        run: |
          npm ci
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          node --test test/explain-onboarding.test.ts test/explain-tutorial.test.ts

  check:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04  # the pinned image the embed tests were validated on
    timeout-minutes: 60  # full suite, browser gates and installed capture; catalog/story run separately
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the fork explainer's test reads Lantern's code at the fork base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      # diagram capture and the embed tests run in headless Chromium (tools/lib/browser.ts)
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lmodern
          python3 -m venv out/lettering-venv
          out/lettering-venv/bin/pip install -r tools/lettering-requirements.txt
          bash tools/lettering-outline-fonts.sh
          echo "RAYNER_LETTERING_PYTHON=$PWD/out/lettering-venv/bin/python" >> "$GITHUB_ENV"
      - name: Check lettering capture and playback
        run: EXPLAIN_LETTERING=1 EXPLAIN_BROWSER=1 node tools/ci-tests.ts --test --test-reporter=spec test/diagram-natural-lettering.test.ts test/lettering-cache.test.ts test/lettering-outlines.test.ts test/lettering-styles.test.ts test/lettering-rtl.test.ts test/lettering-*-audit.test.ts
      - run: npm run check          # tsc -b over every project (emits dist/); compile a TS consumer against it
      - run: FULL=1 node tools/ci-tests.ts --expose-gc --test test/*.test.ts test/browser/*.test.ts # full properties, independent oracles and raster boundaries
      # Product gates reuse this job and its Chromium installation; no scheduled lane.
      - run: |
          node tools/ci-tests.ts "$(command -v npm)" run test:embeds
      - run: EXPLAIN_BROWSER=1 EXPLAIN_LETTERING=1 npm run release:check  # retain the exact tested archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rayner-package-${{ github.sha }}
          path: out/release/
          if-no-files-found: error
          retention-days: 90
          overwrite: true  # a re-run of a failed job uploads again under the same name

  catalog:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # full scene/composite checks and embed heights exceeded 45 minutes locally
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: node tools/ci-tests.ts "$(command -v npm)" run demos:check
      - run: node tools/ci-tests.ts "$(command -v npm)" run check:budgets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rayner-catalog-${{ github.sha }}
          path: out/explainers/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rayner-page-budgets-${{ github.sha }}
          path: out/validation/page-budgets.json
          if-no-files-found: error
          retention-days: 90

  story-part:
    needs: [scope, catalog]
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rayner-catalog-${{ github.sha }}
          path: out/explainers/
      - run: node tools/ci-tests.ts "$(command -v npm)" run demos:review -- --shard ${{ matrix.part }}/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rayner-story-${{ github.sha }}-${{ matrix.part }}
          path: |
            out/review/shard-${{ matrix.part }}-of-3/
            out/validation/browser-review-shard-${{ matrix.part }}-of-3.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  story:
    if: always()  # a failed/missing shard must fail this required check, not skip it
    needs: [scope, catalog, story-part]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the catalog and every story shard to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
          STORY_RESULT: ${{ needs['story-part'].result }}
        run: |
          test "$SCOPE_RESULT" = success
          if test "$FULL" = true; then
            test "$CATALOG_RESULT" = success && test "$STORY_RESULT" = success
          else
            test "$FULL" = false
          fi
      - if: needs.scope.outputs.full == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: needs.scope.outputs.full == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - if: needs.scope.outputs.full == 'true'
        run: npm ci
      - if: needs.scope.outputs.full == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rayner-catalog-${{ github.sha }}
          path: out/explainers/
      - if: needs.scope.outputs.full == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rayner-story-${{ github.sha }}-*
          merge-multiple: true
          path: out/
      - if: needs.scope.outputs.full == 'true'
        run: node tools/explain-review-merge.ts
      - if: needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rayner-story-${{ github.sha }}
          path: out/validation/browser-review.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  compatibility:
    needs: [scope, check]
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Current standard ARM image; macos-15 ARM jobs failed to acquire runners.
        os: [ubuntu-24.04, macos-26, macos-15-intel]
        node: ['24.0.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # types, standard suite, browser checks and installed starter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # retain the fork-base source oracle on every platform
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ matrix.node == '24' }}
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      # Pure engine/property assertions have one full owner above. The minimum
      # Node lane retains standard tests and installed browser smoke for API/warning drift.
      - if: matrix.os == 'ubuntu-24.04' && matrix.node == '24.0.0'
        run: npm run check && node tools/ci-tests.ts --expose-gc --test test/*.test.ts test/browser/*.test.ts
      - if: matrix.os == 'ubuntu-24.04' && matrix.node == '24.0.0'
        run: EXPLAIN_BROWSER=1 node tools/ci-tests.ts --test test/explain-cli.test.ts test/browser/explain-review-scene.test.ts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rayner-package-${{ github.sha }}
          path: out/release/
      - run: EXPLAIN_BROWSER=1 npm run pack:smoke -- --manifest out/release/manifest.json
        # Install the exact primary candidate on Linux and both Mac architectures.
      # Real browser diversity replaces four duplicate Chromium/property runs.
      - if: matrix.os == 'macos-26' && matrix.node == '24'
        run: npx playwright-core install webkit
      - if: matrix.os == 'macos-26' && matrix.node == '24'
        run: sudo /usr/bin/safaridriver --enable
      - if: matrix.os == 'macos-26' && matrix.node == '24'
        run: EXPLAIN_WEBKIT=1 EXPLAIN_SAFARI=1 node tools/ci-tests.ts --test test/reader-cross-browser.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'macos-26' && matrix.node == '24' && always()
        with:
          name: rayner-safari-${{ github.sha }}
          path: |
            out/validation/native-safari.json
            out/validation/webkit.json
          if-no-files-found: warn
          retention-days: 90
