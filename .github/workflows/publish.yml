name: publish
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a new npm version, or validate and archive an existing one
        required: true
        default: publish
        type: choice
        options: [publish, archive]
      version:
        description: Existing npm version to archive (archive operation only)
        default: '0.1.0'
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: next
        type: choice
        options: [next, latest]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.operation != 'archive'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    # Select an existing vX.Y.Z git tag when dispatching, never a branch or PR.
    if: inputs.operation != 'archive' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: write # retain the tested tarball and manifest on its GitHub Release
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rayner-package-${{ github.sha }}
          path: out/release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rayner-story-${{ github.sha }}
          path: out/release/validation/
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rayner-page-budgets-${{ github.sha }}
          path: out/release/validation/
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rayner-safari-${{ github.sha }}
          path: out/release/validation/
          merge-multiple: true
      - name: Verify tested archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: node tools/publish-release.ts
  archive:
    if: inputs.operation == 'archive'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}
          fetch-depth: 0
          path: release-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
      - run: npm ci
        working-directory: release-source
      - run: npx playwright-core install --with-deps --only-shell chromium
        working-directory: release-source
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-lmodern
          python3 -m venv out/lettering-venv
          out/lettering-venv/bin/pip install -r tools/lettering-requirements.txt
          bash tools/lettering-outline-fonts.sh
          echo "RAYNER_LETTERING_PYTHON=$PWD/out/lettering-venv/bin/python" >> "$GITHUB_ENV"
        working-directory: release-source
      - name: Validate public npm bytes and preserve them on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_VERSION: ${{ inputs.version }}
          ARCHIVE_SOURCE: ${{ github.workspace }}/release-source
          EXPLAIN_BROWSER: '1'
          EXPLAIN_LETTERING: '1'
        run: node release-tools/tools/archive-published-release.ts
