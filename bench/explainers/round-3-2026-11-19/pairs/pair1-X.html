inipanel{border:1px solid var(--line);padding:14px;border-radius:8px}.minipanel h3{margin:0 0 9px;font-size:13px}.stategrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{padding:12px 7px;border:1px solid #a3b6ad;border-radius:7px;font-size:13px;text-align:center;background:#fffef8}.pill.active{background:var(--lime);border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}.region{border:1px dashed #9aae9f;border-radius:8px;padding:12px;margin-top:8px}.region .stategrid{grid-template-columns:1fr 1fr}.region h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--teal)}.sign{padding:18px 22px;margin:16px;background:#edf3ec;border-radius:8px}.sign b{display:block;font-size:12px;color:var(--teal);margin-bottom:8px}.sign p{font-size:19px;font-weight:650;line-height:1.35;margin:0}.bigcount{font-size:55px;line-height:1.2;font-weight:750;letter-spacing:-3px}.formula{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.formula article{border:1px solid var(--line);border-radius:8px;padding:18px}.formula h3{font-size:13px;margin:0 0 12px}.formula p{font-size:13px;margin:5px 0}.sequence{display:flex;gap:6px;padding:12px 18px;flex-wrap:wrap}.sequence span{font:10px ui-monospace,monospace;padding:4px 6px;background:#edf1e6;border-radius:4px}.answer{padding:19px 22px}.answer h3{font-size:17px;margin:0 0 10px}.answer p{font-size:14px}.answer ul{padding-left:18px;font-size:14px}.definition{font-size:29px;line-height:1.35;letter-spacing:-.7px;padding:28px}.definition em{font-style:normal;background:var(--lime)}details{font-size:12px;padding:12px 20px;border-top:1px solid var(--line)}summary{cursor:pointer;font-weight:650}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(min-width:761px){main{padding-top:18px}.layout{gap:34px;grid-template-columns:330px 1fr}.compare.media{padding:12px;gap:10px}.compare.media .minipanel{padding:10px}.compare.media svg{display:block;width:100%;height:208px}.stage .answer>.pill{padding:7px}.stage details{padding:9px 18px}.stage .answer .compare .region h4{margin-bottom:5px}.stage .answer>.region{padding:9px;margin-top:0}.stage .answer .compare>.region{padding:8px;margin-top:0}.stage .answer .compare .pill{padding:5px}.stage .answer .compare p{margin-bottom:5px!important}.prompt{margin-top:16px;padding-top:11px}.option{margin:5px 0}.nav{margin-top:12px;padding-top:14px}.answer{padding:15px 18px}.controls{padding:10px 15px}.status{padding:9px 15px}.sequence{padding:8px 15px}}@media(max-width:760px){header{padding:16px 20px 12px}.topnote{display:none}main{padding:21px 20px 10px}.layout{grid-template-columns:1fr;gap:20px;min-height:0}h1{font-size:32px;margin-bottom:15px}.number{margin-bottom:11px}.intro{font-size:16px}.aside{margin-bottom:0}.stagehead{padding:13px 14px 10px}.stagehead h2{font-size:14px}.badge{font-size:10px}.diagram{padding:8px 2px}.caption{padding:0 14px 12px}.compare{padding:12px;gap:9px}.compare.media{grid-template-columns:1fr}.compare.media .minipanel svg{display:block;width:100%;max-height:280px}.compare.media .minipanel:nth-child(2) .sign{padding:12px}.compare.media .minipanel:nth-child(2) .sign p{font-size:16px}.minipanel{padding:9px}.pill{font-size:11px;padding:10px 3px}.region{padding:8px}.stategrid{gap:6px}.region .stategrid{grid-template-columns:1fr}.nav{gap:10px;position:relative}.nav button{padding:11px 14px;min-width:auto}.progress{gap:3px}.formula{padding:14px;gap:10px}.formula article{padding:12px}.bigcount{font-size:45px}.definition{font-size:25px;padding:24px}.controls{padding:12px}.status{padding:11px 14px}.answer{padding:18px}.sign{margin:12px;padding:17px}.sign p{font-size:18px}footer{padding:0 20px 18px}.keyboard{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand"><b>S</b> Working models</div><div class="eyebrow">A field guide to statecharts</div><span class="topnote">15 short steps · learn by trying</span></header><main><div id="lesson"></div><nav class="nav" aria-label="Lesson steps"><button class="back" id="back">← Back</button><div class="progress" aria-hidden="true"></div><button class="next" id="next">Next →</button></nav></main><footer><span id="position"></span><span class="keyboard">← → to navigate · all controls work with Tab</span></footer><script>
'use strict';
const coffeeStates=['idle','grinding','brewing','ready'];const coffeeEvents=['POWER_ON','START','GROUND','BREWED','TAKE','POWER_OFF'];
const cycle={idle:['START','grinding'],grinding:['GROUND','brewing'],brewing:['BREWED','ready'],ready:['TAKE','idle']};
function coffee(s,e,broken=false){if(s==='off')return e==='POWER_ON'?'idle':s;if(e==='POWER_OFF')return broken&&s==='brewing'?s:'off';return cycle[s][0]===e?cycle[s][1]:s}
function nested(s,e,mode='inside'){let [c,f]=s.split('|');if(mode==='steam'){if(c==='off')return e==='POWER_ON'?'idle':s;if(e==='POWER_OFF')return'off';if(c==='brewing'&&(e==='FROTH'||e==='STOP'))return'brewing|'+(e==='FROTH'?'frothing':'still');let n=coffee(c,e);return n===c?s:n==='brewing'?'brewing|still':n}if(mode==='independent'){return coffee(c,e)+'|'+(e==='FROTH'?'frothing':e==='STOP'?'still':f)}if(c==='off')return e==='POWER_ON'?'idle|still':'off';if(e==='POWER_OFF')return'off';return coffee(c,e)+'|'+(e==='FROTH'?'frothing':e==='STOP'?'still':f)}
function flatTable(mode){let states=mode==='independent'?['off',...coffeeStates].flatMap(c=>['still','frothing'].map(f=>c+'|'+f)):mode==='steam'?['off','idle','grinding','brewing|still','brewing|frothing','ready']:['off',...coffeeStates.flatMap(c=>['still','frothing'].map(f=>c+'|'+f))];let table=Object.fromEntries(states.map(s=>[s,{}]));function edge(a,e,b){table[a][e]=b}if(mode==='independent'){for(const f of ['still','frothing']){edge('off|'+f,'POWER_ON','idle|'+f);for(let i=0;i<4;i++){let c=coffeeStates[i];edge(c+'|'+f,cycle[c][0],cycle[c][1]+'|'+f);edge(c+'|'+f,'POWER_OFF','off|'+f)}}for(const c of ['off',...coffeeStates]){edge(c+'|still','FROTH',c+'|frothing');edge(c+'|frothing','STOP',c+'|still')}}else if(mode==='steam'){edge('off','POWER_ON','idle');edge('idle','START','grinding');edge('grinding','GROUND','brewing|still');for(const f of ['still','frothing'])edge('brewing|'+f,'BREWED','ready');edge('ready','TAKE','idle');for(const s of states.filter(s=>s!=='off'))edge(s,'POWER_OFF','off');edge('brewing|still','FROTH','brewing|frothing');edge('brewing|frothing','STOP','brewing|still')}else{edge('off','POWER_ON','idle|still');for(const f of ['still','frothing'])for(const c of coffeeStates){edge(c+'|'+f,cycle[c][0],cycle[c][1]+'|'+f);edge(c+'|'+f,'POWER_OFF','off')}for(const c of coffeeStates){edge(c+'|still','FROTH',c+'|frothing');edge(c+'|frothing','STOP',c+'|still')}}return table}
function player(s,e){let [p,v]=s.split('|');if(e==='PLAY')p='playing';if(e==='PAUSE')p='stopped';if(e==='MUTE')v='muted';if(e==='UNMUTE')v='audible';return p+'|'+v}const playerTable={};for(const p of ['stopped','playing'])for(const v of ['audible','muted']){let s=p+'|'+v;playerTable[s]={PLAY:'playing|'+v,PAUSE:'stopped|'+v,MUTE:p+'|muted',UNMUTE:p+'|audible'}}
let step=0,brew='idle',froth='idle|still',media='stopped|audible',flatMedia='stopped|audible',trace=[],notice='',answers={};
const svgStart='<svg viewBox="0 0 560 280" role="img" aria-label="Coffee state machine: idle, grinding, brewing and ready form a cycle. Off enters idle on POWER_ON. POWER_OFF leaves on."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#5c746e"/></marker></defs>';
function node(x,y,w,name,active){return `<rect class="node ${active?'active':''}" x="${x}" y="${y}" width="${w}" height="42" rx="7"/><text class="state" x="${x+w/2}" y="${y+26}" text-anchor="middle">${name}</text>`}
function edge(d,label,x,y,cls=''){return `<path class="edge ${cls}" d="${d}"/><text class="event" x="${x}" y="${y}" text-anchor="middle">${label}</text>`}
function coffeeDiagram(kind='basic',s=brew){const parent=kind==='parent',flat=kind==='flat'||kind==='broken',off=parent||flat;let z=svgStart.replace('Coffee state machine: idle, grinding, brewing and ready form a cycle. Off enters idle on POWER_ON. POWER_OFF leaves on.',off?(parent?'Coffee statechart: on contains idle, grinding, brewing and ready. POWER_OFF from on goes to off; POWER_ON enters idle.':'Flat coffee machine: off plus idle, grinding, brewing and ready. '+(kind==='broken'?'Brewing has no POWER_OFF arrow.':'Every working state has POWER_OFF to off.')):'Coffee machine: idle to grinding on START, to brewing on GROUND, to ready on BREWED, to idle on TAKE.');if(parent)z+='<rect class="parent" x="125" y="18" width="420" height="245" rx="12"/><text class="small" x="140" y="40">on · one child active</text>';let xs=off?[145,375]:[90,365],ys=[64,200];z+=node(xs[0],ys[0],130,'idle',s==='idle')+node(xs[1],ys[0],130,'grinding',s==='grinding')+node(xs[1],ys[1],130,'brewing',s==='brewing')+node(xs[0],ys[1],130,'ready',s==='ready');z+=edge(`M${xs[0]+130} 85 H${xs[1]}`,'START',(xs[0]+130+xs[1])/2,75)+edge(`M${xs[1]+65} 106 V200`,'GROUND',xs[1]+65,157)+edge(`M${xs[1]} 221 H${xs[0]+130}`,'BREWED',(xs[0]+130+xs[1])/2,244)+edge(`M${xs[0]+65} 200 V106`,'TAKE',xs[0]+65,157);if(!off)z+='<circle cx="53" cy="85" r="5"/>'+edge('M58 85 H90','',0,0);if(off){z+=node(8,120,92,'off',s==='off');z+=edge('M54 120 V85 H145','POWER_ON',91,74);if(parent){z+=edge('M125 180 H100','POWER_OFF',65,202);z+='<circle cx="140" cy="53" r="4"/>'+edge('M144 53 H167 V64','',0,0)}else{z+=edge('M145 88 L100 130','OFF',111,111)+edge('M145 220 L100 152','OFF',111,190)+edge('M440 64 V16 H54 V120','POWER_OFF',295,13);if(kind==='broken')z+='<path class="edge bad" d="M375 221 Q310 282 85 163"/><text class="event" x="305" y="273" style="fill:#b44825">missing POWER_OFF</text>';else z+=edge('M375 221 Q310 280 85 163','POWER_OFF',300,273)}}return (z+'</svg>').replaceAll('id="arrow"','id="arrow-'+kind+'"').replaceAll('url(#arrow)','url(#arrow-'+kind+')')}
function frame(title,badge,body){return `<section class="stage" aria-label="${title}"><div class="stagehead"><h2>${title}</h2><span class="badge">${badge}</span></div>${body}</section>`}
function controls(events,kind){return `<div class="controls" aria-label="Send an event">${events.map(e=>`<button data-event="${e}" data-kind="${kind}">${e}</button>`).join('')}<button data-reset="${kind}" aria-label="Reset ${kind}">↺ Reset</button></div>`}
function status(s){return `<div class="status" role="status">${s}</div>`}
function coffeePanel(kind,live=false){let counts=kind==='basic'?'4 boxes · 4 arrows':kind==='parent'?'6 boxes · 6 arrows':kind==='broken'?'5 boxes · 8 of 9 arrows':'5 boxes · 9 arrows';return frame(kind==='parent'?'A parent takes the shared event':'The coffee machine',counts,`<div class="diagram">${coffeeDiagram(kind)}</div><div class="caption">${kind==='parent'?'The outer on box is a state too. Its start dot enters idle.':kind==='broken'?'Dashed orange = an omitted arrow in this hand copy.':'A dot marks the start. An arrow says which event changes state.'}</div>${kind==='parent'?'<details><summary>Inspect the complete flat counterpart · 5 boxes / 9 arrows</summary><div class="diagram">'+coffeeDiagram('flat')+'</div></details>':''}${live?controls(kind==='basic'?['START','GROUND','BREWED','TAKE']:coffeeEvents,'coffee')+status(`Active: <strong>${brew}</strong>${notice?' · '+notice:''}`):''}`)}
function question(id,legend,options,correct,feedback){return `<div class="prompt"><fieldset><legend>${legend}</legend>${options.map((o,i)=>`<label class="option"><input type="radio" name="${id}" value="${i}" ${answers[id]===i?'checked':''}>${o}</label>`).join('')}</fieldset><div class="feedback" role="status">${answers[id]===undefined?'Choose an answer; then continue.':answers[id]===correct?feedback:'Try another answer, or continue to see the explanation.'}</div></div>`}
function mediaSvg(regions,live){let [p,v]=media.split('|');let z='<svg viewBox="0 0 300 220" role="img" aria-label="'+(regions?'Two regions: stopped and playing linked by PLAY and PAUSE; audible and muted linked by MUTE and UNMUTE.':'Four pairings. Horizontal PLAY and PAUSE arrows change playback; vertical MUTE and UNMUTE arrows change volume.')+'"><defs><marker id="m'+regions+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#5c746e"/></marker></defs>';function n(x,y,a,b){let active=live&&(regions?(a===p||a===v):flatMedia===a+'|'+b);return '<rect class="node '+(active?'active':'')+'" x="'+x+'" y="'+y+'" width="110" height="48" rx="7"/><text x="'+(x+55)+'" y="'+(y+(b?20:29))+'" text-anchor="middle" style="font-size:14px;font-weight:650">'+a+'</text>'+(b?'<text x="'+(x+55)+'" y="'+(y+37)+'" text-anchor="middle" style="font-size:12px">· '+b+'</text>':'')}function e(d,l,x,y){return '<path d="'+d+'" fill="none" stroke="#5c746e" stroke-width="1.4" marker-end="url(#m'+regions+')"/><text x="'+x+'" y="'+y+'" text-anchor="middle" style="font:9px ui-monospace;paint-order:stroke;stroke:#fffef8;stroke-width:4px;fill:#3f5b56">'+l+'</text>'}if(regions){z+='<path d="M0 115 H300" stroke="#9aae9f" stroke-dasharray="5 4"/><text x="5" y="18" style="font-size:11px;fill:#006b5b">PLAYBACK · ● → stopped</text><text x="5" y="143" style="font-size:11px;fill:#006b5b">VOLUME · ● → audible</text>';z+=n(5,35,'stopped')+n(185,35,'playing')+n(5,158,'audible')+n(185,158,'muted');z+=e('M115 47 H185','PLAY',150,39)+e('M185 72 H115','PAUSE',150,91)+e('M115 170 H185','MUTE',150,162)+e('M185 195 H115','UNMUTE',150,217)}else{z+=n(5,20,'stopped','audible')+n(185,20,'playing','audible')+n(5,155,'stopped','muted')+n(185,155,'playing','muted');for(const y of [32,167])z+=e('M115 '+y+' H185','PLAY',150,y-7)+e('M185 '+(y+25)+' H115','PAUSE',150,y+44);for(const x of [37,217])z+=e('M'+x+' 68 V155','MUTE',x,101)+e('M'+(x+48)+' 155 V68','UNMUTE',x+48,132)}return z+'</svg>'}
function mediaPanels(regions=true,live=false){return frame(live?'One event stream, two drawings':'Playback × volume',regions?'Same behaviour': '4 boxes · 8 arrows',`<div class="compare media"><div class="minipanel"><h3>Flat · 4 boxes / 8 arrows</h3>${mediaSvg(false,live)}</div><div class="minipanel"><h3>${regions?'Regions · 4 boxes / 4 arrows':'Two independent choices'}</h3>${regions?mediaSvg(true,live):'<div class="sign" style="margin:0;padding:14px"><b>PLAYBACK</b><p>stopped<br>or playing</p></div><div class="sign" style="margin:12px 0 0;padding:14px"><b>VOLUME</b><p>audible<br>or muted</p></div>'}</div></div><div class="caption">${regions?'One active state per region. Both regions are active at once.':'Every flat state must name both playback and volume. Start at stopped · audible.'}</div>${live?controls(['PLAY','PAUSE','MUTE','UNMUTE'],'media')+status(`Flat: <strong>${flatMedia.replace('|',' · ')}</strong><br>Statechart: <strong>${media.replace('|',' · ')}</strong> — ${media===flatMedia?'match ✓':'mismatch'}`)+`<div class="sequence" aria-label="Event history">${trace.length?trace.map(x=>`<span>${x}</span>`).join(''):'<span>Send an event to begin</span>'}</div>`:''}`)}
function frotherPanel(){let [c,f]=froth.split('|');return frame('Coffee + frother, inside on','8 boxes · 8 arrows',`<div class="answer" style="padding-bottom:0"><div class="pill ${c==='off'?'active':''}" style="width:85px">off</div><p style="font:11px ui-monospace;margin:8px 0">POWER_ON → on · POWER_OFF → off</p><div class="region" style="background:#edf3ec"><h4>on · both regions active</h4><div class="compare" style="padding:0"><div class="region"><h4>Coffee</h4><div class="stategrid">${coffeeStates.map(x=>`<div class="pill ${c===x?'active':''}">${x}</div>`).join('')}</div><p style="font-size:11px;margin:8px 0">● → idle<br>START → GROUND → BREWED → TAKE ↻</p></div><div class="region"><h4>Frother</h4>${['still','frothing'].map(x=>`<div class="pill ${f===x?'active':''}" style="margin-bottom:6px">${x}</div>`).join('')}<p style="font-size:11px;margin:8px 0">● → still<br>FROTH → frothing<br>STOP → still</p></div></div></div></div><div class="caption">Flat: 1 off + (4 coffee × 2 frother) = <strong>9 states, 25 arrows.</strong></div><details><summary>Inspect the flat counterpart · 9 states / 25 arrows</summary><div class="stategrid" style="margin:12px 0">${Object.keys(flatTable('inside')).map(s=>`<div class="pill">${s.replace('|',' · ')}</div>`).join('')}</div><p>Each row below lists the outgoing arrows for one flat state.</p>${Object.entries(flatTable('inside')).map(([s,es])=>`<p><strong>${s.replace('|',' · ')}</strong><br>${Object.entries(es).map(([e,t])=>`${e} → ${t.replace('|',' · ')}`).join('<br>')}</p>`).join('')}</details>${controls([...coffeeEvents,'FROTH','STOP'],'frother')}${status(`Active: <strong>${froth.replace('|',' · ')}</strong>${notice?' · '+notice:''}`)}`)}
const steps=[
{tag:'Start with the familiar',title:'One state at a time.',text:'A coffee machine is a state machine: it is idle, grinding, brewing or ready. An event follows an arrow to the next state.',aside:'Try START → GROUND → BREWED → TAKE. An event with no arrow does nothing.',view:()=>coffeePanel('basic',true)},
{tag:'01 / Repeated arrows',title:'Now add a power button.',text:'Add off and POWER_ON. POWER_OFF should work from every one of the four working states.',aside:'Predict the cost before seeing the drawing.',q:()=>question('power','How many POWER_OFF arrows must a flat machine add?',['1 arrow','4 arrows','5 arrows'],1,'Yes. One from each working state.'),view:()=>frame('Four possible starting places','Prediction',`<div class="diagram">${coffeeDiagram('basic')}</div><div class="sign"><b>THE REQUIREMENT</b><p>From idle, grinding, brewing or ready, POWER_OFF must lead to off.</p></div>`)},
{tag:'01 / Repeated arrows',title:'Copying is easy to get wrong.',text:'Four POWER_OFF arrows, plus one POWER_ON arrow: the complete flat machine needs 9 arrows. This hand copy has only 8. Brewing’s power-off arrow is missing.',aside:'This is a deliberately incomplete drawing, not real appliance behaviour. Reach brewing, then try POWER_OFF.',view:()=>coffeePanel('broken',true)},
{tag:'01 / A parent state',title:'Give the box the arrow.',text:'Put the four working states inside on. A POWER_OFF arrow from on applies to any active child. One arrow replaces four copies.',aside:'A parent is active when its child is active. Events try the inner state first, then its parent. Here no child handles POWER_OFF.',q:()=>question('parent','Where should the shared POWER_OFF arrow start?',['At the on parent','At the start dot','Only at idle'],0,'Exactly. The parent handles it for every child.'),view:()=>coffeePanel('parent',true)},
{tag:'02 / Repeated combinations',title:'A different kind of repetition.',text:'A media player can be stopped or playing, and audible or muted. These are independent choices. A flat machine needs every pairing.',aside:'PLAY changes playback without changing volume. MUTE changes volume without changing playback.',view:()=>mediaPanels(false)},
{tag:'02 / Predict the cost',title:'Add one more switch.',text:'Imagine a third independent, two-state feature: captions on or off. Every existing pairing needs both versions.',aside:'The flat machine has 4 states and 8 arrows with two features. Count only feature-changing arrows here.',q:()=>question('third','What does a third binary feature cost the flat machine?',['6 states, 6 arrows','8 states, 24 arrows','8 states, 12 arrows'],1,'Yes. 2 × 2 × 2 = 8 states; 3 outgoing toggles each = 24 arrows.'),view:()=>frame('Independent features multiply','Make a prediction',`<div class="formula"><article><h3>Two features</h3><div class="bigcount">2²</div><p>4 flat states</p><p>2 × 4 = 8 arrows</p></article><article><h3>Three features</h3><div class="bigcount">2³</div><p>How many flat states?</p><p>3 arrows leave each state.</p></article></div><div class="sign"><b>LOOK AT THE NAMES</b><p>playing · muted · captions on<br>playing · muted · captions off</p></div>`)},
{tag:'02 / Parallel regions',title:'Keep independent choices apart.',text:'Split the chart into regions. Playback has one active state; volume has one active state. The two regions run at the same time.',aside:'Third feature answer: flat = 8 states / 24 arrows. Three regions = 6 leaf boxes / 6 arrows. With n binary features: 2ⁿ vs 2n states.',view:()=>mediaPanels(true)},
{tag:'03 / Same behaviour',title:'Send both drawings the same events.',text:'A statechart changes how we draw the machine, not what it can do. Flatten its active regions into pairs and you get an ordinary state machine.',aside:'Try PLAY → MUTE → PAUSE → UNMUTE. Both drawings must always name the same configuration.',view:()=>mediaPanels(true,true)},
{tag:'03 / Combine the ideas',title:'Regions can live inside a parent.',text:'Put the player’s two regions inside on, beside off. POWER_OFF now leaves both regions. POWER_ON starts them again at stopped and audible.',aside:'Hierarchy removes repeated exits. Regions remove repeated combinations. You can use both in one chart.',view:()=>frame('The player, now with power','6 boxes · 6 arrows',`<div class="answer"><div class="pill" style="width:90px">off</div><p style="font:12px ui-monospace;margin:10px 0">POWER_ON ↓ ↑ POWER_OFF</p><div class="region"><h4>on</h4><div class="compare" style="padding:0"><div class="region"><h4>Playback</h4><p>● → stopped<br>PLAY ⇄ PAUSE<br>playing</p></div><div class="region"><h4>Volume</h4><p>● → audible<br>MUTE ⇄ UNMUTE<br>muted</p></div></div></div><p style="margin-top:15px"><strong>Flattened: 5 boxes, 13 arrows.</strong><br>4 pairings + off. Eight feature arrows, four power-off arrows and one power-on arrow.</p></div>`)},
{tag:'04 / Your turn',title:'Where does the frother go?',text:'Add a milk frother that can be still or frothing whenever the coffee machine is on. Coffee and frothing can change independently.',aside:'Choose before revealing the answer. Remember to count off in the flat machine.',q:()=>question('transfer','Where does it belong, and how many flat states?',['Beside coffee, inside on · 9','Inside brewing · 6','Beside the whole machine · 10'],0,'That fits: the frother shares power, but not the coffee cycle.'),view:()=>frame('Place the new feature','Transfer exercise',`<div class="diagram">${coffeeDiagram('parent')}</div><div class="sign"><b>NEW FEATURE</b><p>still ⇄ frothing<br><span style="font-size:13px;font-weight:400">FROTH / STOP · only while on</span></p></div>`)},
{tag:'04 / Reveal & try',title:'Two regions, inside on.',text:'Coffee and the frother are separate regions within on. The flat machine pairs 4 coffee states with 2 frother states, plus off: 9 states.',aside:'Try START, then FROTH. You can be grinding and frothing at once. Each event changes only its own region.',view:()=>frotherPanel()},
{tag:'05 / Change the boundary',title:'Give the frother its own power.',text:'Now FROTH and STOP work whether the coffee machine is on or off. Where does the region go? How many states does the flat machine need?',q:()=>question('own','Predict the new boundary and count.',['Outside on, beside the whole machine · 10','Inside on · 9','Inside brewing · 6'],0,'Correct. Off also pairs with still and frothing.'),view:()=>frame('Check yourself · 1','Try, then reveal',`<div class="answer"><div class="sign" style="margin:0 0 15px"><b>CHANGED REQUIREMENT</b><p>The coffee machine is off.<br>The frother can still run.</p></div><button class="smallbtn" data-reveal="own">${answers.revealown?'Hide explanation':'Reveal explanation'}</button>${answers.revealown?'<h3 style="margin-top:18px">Beside the whole coffee machine.</h3><p>The top level now splits into two regions: the entire off-and-on coffee machine, and the frother. Every one of the coffee machine’s 5 states pairs with still or frothing.</p><p><strong>5 × 2 = 10 flat states</strong>, compared with 9 when the frother was inside on.</p>':''}</div>`)},
{tag:'05 / Change the dependency',title:'What if it needs brewing steam?',text:'The frother can be still or frothing only while brewing. Leaving brewing stops it. Write the flat state names before revealing the answer.',q:()=>question('steam','Are coffee and frothing still independent regions?',['Yes · keep the frother beside coffee','No · put its two states inside brewing'],1,'Yes: only brewing splits. This is a parent again.'),view:()=>frame('Check yourself · 2','Try, then reveal',`<div class="answer"><label for="state-names" style="font-size:14px;font-weight:650">Your flat state names</label><textarea id="state-names" style="display:block;width:100%;min-height:78px;margin:10px 0 14px;padding:10px;font:14px/1.5 system-ui;border:1px solid #9aae9f;border-radius:6px" placeholder="off, idle, …">${answers.names||''}</textarea><button class="smallbtn" data-reveal="steam">${answers.revealsteam?'Hide explanation':'Reveal explanation'}</button>${answers.revealsteam?'<h3 style="margin-top:18px">Six states. A parent inside a parent.</h3><p>off; idle; grinding; brewing · still; brewing · frothing; ready.</p><p>Only brewing has two words. The choices are dependent, so the region sign does not apply. Put still and frothing <strong>inside brewing</strong>.</p><p>Statechart: <strong>8 transitions</strong>. Flat: <strong>13 transitions</strong>.</p>':'<p style="margin-top:15px;color:var(--muted)">Only the brewing configurations should need two words.</p>'}</div>`)},
{tag:'05 / Check the restart',title:'Does the chart remember?',text:'Back to the frother inside on: the machine is grinding while the frother is frothing. Press POWER_OFF, then POWER_ON. Is the frother still frothing?',q:()=>question('memory','Predict the state after powering on again.',['grinding · frothing','idle · frothing','idle · still'],2,'Correct. Both regions re-enter at their start dots.'),aside:'Try the power cycle, then follow each region’s start dot. There is no history state in this chart.',view:()=>frotherPanel()},
{tag:'Take it with you',title:'Less repetition. Same machine.',text:'A statechart is a state machine whose states can contain other states, active one at a time or several at once.',aside:'Two signs in a flat machine tell you where those extra structures may help.',view:()=>frame('What to look for','Two useful signs',`<div class="sign"><b>1 / REPEATED DESTINATION</b><p>One event leaves many states for the same place → try a parent.</p></div><div class="sign"><b>2 / INDEPENDENT WORDS</b><p>State names combine independent choices → try regions.</p></div><div class="caption">Flatten either structure and the behaviour remains an ordinary state machine.</div><details><summary>Scope & correctness notes</summary><p style="margin-top:10px">These examples use inner-state-first event handling, as in XState and SCXML. Statemate priorities differ. Guards, actions, history, final states and delays are outside this lesson.</p><p>The reference script records XState 5.33.3 grounding. This independent implementation checks its own models and generated flat transition tables; it does not bundle or execute XState.</p><p>Counts exclude start dots and start arrows; every drawn state container counts as a box. Region boundaries do not count as states. The 3–5 feature counts and changed frother questions use combinatorial checks.</p></details>`) }
];
function render(focus=false){const s=steps[step];document.getElementById('lesson').innerHTML=`<div class="layout"><section><div class="number">${String(step+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')} <span style="margin-left:15px">${s.tag}</span></div><h1 tabindex="-1">${s.title}</h1><p class="intro">${s.text}</p>${s.aside?`<p class="aside">${s.aside}</p>`:''}${s.q?s.q():''}</section>${s.view()}</div>`;document.getElementById('back').disabled=step===0;document.getElementById('next').textContent=step===steps.length-1?'Start again ↺':'Next →';document.querySelector('.progress').innerHTML=steps.map((_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('');document.getElementById('position').textContent=`Step ${step+1} of ${steps.length} · ${s.tag}`;if(focus){document.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,0)}}
function go(delta){step=step===steps.length-1&&delta===1?0:Math.max(0,Math.min(steps.length-1,step+delta));notice='';if(step===2)brew='idle';if(step===3)brew='idle';if(step===13)froth='grinding|frothing';render(true)}
document.getElementById('next').onclick=()=>go(1);document.getElementById('back').onclick=()=>go(-1);document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){answers[e.target.name]=Number(e.target.value);const active=e.target.name,index=e.target.value;render();document.querySelector(`input[name="${active}"][value="${index}"]`).focus()}});document.addEventListener('input',e=>{if(e.target.id==='state-names')answers.names=e.target.value.replace(/[<>]/g,'')});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let ev=b.dataset.event,k=b.dataset.kind;if(ev){let prev;if(k==='coffee'){prev=brew;brew=coffee(brew,ev,step===2);notice=prev===brew?'no transition for '+ev:'took '+ev}else if(k==='frother'){prev=froth;froth=nested(froth,ev);notice=prev===froth?'no transition for '+ev:'took '+ev}else{media=player(media,ev);flatMedia=playerTable[flatMedia][ev];trace.push(ev);trace=trace.slice(-8)}render();document.querySelector(`[data-event="${ev}"]`)?.focus({preventScroll:true})}if(b.dataset.reset){let k=b.dataset.reset;if(k==='coffee')brew='idle';if(k==='frother')froth='idle|still';if(k==='media'){media=flatMedia='stopped|audible';trace=[]}notice='reset to start';render();document.querySelector(`[data-reset="${k}"]`)?.focus({preventScroll:true})}if(b.dataset.reveal){let key='reveal'+b.dataset.reveal;answers[key]=!answers[key];render();document.querySelector(`[data-reveal="${b.dataset.reveal}"]`)?.focus({preventScroll:true})}});
window.lessonAPI={steps:steps.map(s=>({heading:s.title})),goTo(n){step=n;notice='';brew='idle';media=flatMedia='stopped|audible';trace=[];froth=n===13?'grinding|frothing':'idle|still';answers={};render()},coffee,nested,flatTable,player,playerTable,featureCounts(n){return{flatStates:2**n,flatArrows:n*2**n,chartStates:2*n,chartArrows:2*n}}};render();
</script></body></html>
