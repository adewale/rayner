<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statecharts, Step by Step</title>
<meta name="description" content="A step-through explainer of statecharts: state machines that nest states and run parts side by side.">
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --ink:#1b1d23; --muted:#545a68; --line:#6f7584; --faint:#e4e2db;
  --accent:#2152c4; --accent-ink:#ffffff; --accent-soft:#e5ebfa;
  --hit:#0d7650; --hit-soft:#e1f3ea; --miss:#9a5600; --miss-soft:#fbf0de;
  --danger:#bd2f25; --danger-soft:#fbe8e5; --box:#eef2f9; --focus:#c2410c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --surface:#1d2027; --ink:#eceef2; --muted:#a6acb9; --line:#8a91a1; --faint:#2c3039;
    --accent:#7aa2ff; --accent-ink:#0b1022; --accent-soft:#232c42;
    --hit:#45d39b; --hit-soft:#173328; --miss:#f2ab45; --miss-soft:#3a2c14;
    --danger:#ff7d70; --danger-soft:#3b1d1a; --box:#232836; --focus:#fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --ink:#eceef2; --muted:#a6acb9; --line:#8a91a1; --faint:#2c3039;
  --accent:#7aa2ff; --accent-ink:#0b1022; --accent-soft:#232c42;
  --hit:#45d39b; --hit-soft:#173328; --miss:#f2ab45; --miss-soft:#3a2c14;
  --danger:#ff7d70; --danger-soft:#3b1d1a; --box:#232836; --focus:#fb923c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:8px;z-index:10;background:var(--surface);padding:6px 10px}
header.top{display:flex;align-items:center;gap:16px;padding:10px 28px;border-bottom:1px solid var(--faint)}
header.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.progress{flex:1;height:6px;background:var(--faint);border-radius:3px;overflow:hidden;max-width:520px;margin-left:auto}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
main#stage{overflow:auto;outline:none}
.step{display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:36px;max-width:1220px;margin:0 auto;padding:22px 32px 24px;align-items:start}
.step > .text{grid-column:1;grid-row:1}
.step > .predicts{grid-column:1;grid-row:2}
.step > .figure{grid-column:2;grid-row:1 / span 2}
.step{grid-template-rows:auto 1fr;row-gap:0}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.step h2{font-size:28px;line-height:1.2;margin:0 0 12px;outline:none}
.text p{margin:0 0 12px}
.text ul{margin:0 0 12px;padding-left:20px}
.text li{margin:2px 0}
.def{font-size:20px;line-height:1.4;padding:12px 14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:4px}
kbd,code{font:600 .82em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--faint);padding:1px 5px;border-radius:4px;white-space:nowrap}
.aside{font-size:15px;background:var(--miss-soft);border-left:4px solid var(--miss);padding:8px 12px;border-radius:4px}
.myth{font-size:16px;background:var(--danger-soft);border-left:4px solid var(--danger);padding:8px 12px;border-radius:4px}
.fb{padding:8px 12px;border-radius:4px;font-weight:500}
.fb.ok{background:var(--hit-soft);border-left:4px solid var(--hit)}
.fb.no{background:var(--miss-soft);border-left:4px solid var(--miss)}
.fb.none{background:var(--faint);border-left:4px solid var(--line)}
fieldset.predict{border:2px solid var(--accent);border-radius:8px;padding:10px 14px 12px;margin:4px 0 12px}
fieldset.predict legend{font-weight:700;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;min-height:44px;min-width:44px;padding:9px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);line-height:1.3}
.opt input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.opts.col{flex-direction:column}
.opts.col .opt span{display:block}
.locked{font-size:14px;color:var(--muted);margin:8px 0 0;min-height:1.4em}
.figure{background:var(--surface);border:1px solid var(--faint);border-radius:12px;padding:14px;min-width:0}
.chart{display:block;width:100%;height:auto;max-height:min(calc(100vh - 290px),420px);margin:0 auto}
.live{display:block}
@media (min-width:1100px){
  .live.side{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr);gap:18px;align-items:center}
  .live.side .ctrl{margin-top:0}
  .live .below{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .live .below .trace{margin-top:10px;border-top:0;border-left:1px solid var(--faint);padding:0 0 0 14px}
}
.rgh{margin:4px 0 0;font-style:italic;color:var(--muted)}
.pair{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pair > *{flex:1 1 300px;min-width:0}
.duo{display:flex;gap:10px}
.duo > *{flex:1 1 0;min-width:0}
.duo .chart{max-height:min(calc(100vh - 330px),380px)}
.pair .chart{max-height:min(calc(100vh - 400px),360px)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.ctrl .lbl{font-size:13px;color:var(--muted);margin-right:2px;width:100%}
button{font:inherit;color:inherit}
.evbtn{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:44px;padding:8px 11px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer}
.evbtn:hover{background:var(--accent);color:var(--accent-ink)}
.ghost{font-size:14px;min-height:44px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.trace{margin-top:10px;font-size:14px;line-height:1.45;border-top:1px solid var(--faint);padding-top:8px;min-height:5.2em}
.trace h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;color:var(--muted)}
.trace ol{margin:0;padding-left:22px}
.trace li{margin:1px 0}
.trace li.miss::marker{color:var(--miss)}
.trace li .tag{font-size:12px;font-weight:700;border-radius:3px;padding:0 4px;margin-right:4px}
.trace li.miss .tag{background:var(--miss-soft);color:var(--miss)}
.trace li.hit .tag{background:var(--hit-soft);color:var(--hit)}
.trace li.ign .tag{background:var(--faint);color:var(--muted)}
.trace .res{margin:4px 0 0;font-weight:600}
.trace .hint{color:var(--muted);margin:0}
.trace li.pending{visibility:hidden}
/* svg */
.chart text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.st rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:fill .25s,stroke .25s}
.st text{font-size:14px;font-weight:600}
.st.small text{font-size:11px;font-weight:600}
.st.active rect{fill:var(--accent);stroke:var(--accent)}
.st.active text{fill:var(--accent-ink)}
.bx > rect{fill:var(--box);stroke:var(--line);stroke-width:1.5}
.bx.active > rect{stroke:var(--accent);stroke-width:2.5}
.bx text{font-size:15px;font-weight:700}
.rg{font-size:12px;font-style:italic;fill:var(--muted)!important}
.divider{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
.st.probe-miss rect,.bx.probe-miss > rect{stroke:var(--miss);stroke-width:3;stroke-dasharray:6 4}
.st.probe-hit rect,.bx.probe-hit > rect{stroke:var(--hit);stroke-width:4;stroke-dasharray:none}
.arr path{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.fired path{stroke:var(--hit);stroke-width:3.2}
.arr.dup path{stroke:var(--danger);stroke-width:2.2}
.arr.q path{stroke-dasharray:5 4}
.arr text{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.arr.inbox text{stroke:var(--box)}
.arr.dup text{fill:var(--danger)}
.arr.fired text{fill:var(--hit)}
.mk{fill:var(--line)} .mk-hit{fill:var(--hit)} .mk-dup{fill:var(--danger)}
.init circle{fill:var(--ink)} .init path{stroke:var(--ink);stroke-width:1.6;fill:none}
.note{font-size:12px;fill:var(--muted)!important;font-style:italic}
.note.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)!important}
.note.huge{font-size:30px;font-style:normal;font-weight:800;fill:var(--danger)!important}
.note.big{font-size:14px;font-style:normal;font-weight:700;fill:var(--ink)!important}
.note.red{fill:var(--danger)!important;font-style:normal;font-weight:700}
.note.green{fill:var(--hit)!important;font-style:normal;font-weight:700}
.badge circle{fill:var(--danger)} .badge text{fill:var(--surface);font-size:11px;font-weight:700}
.chip rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.chip text{font-size:11px;font-weight:600}
.chip.dash rect{stroke-dasharray:4 3;fill:none}
.cell{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1}
/* booleans */
.bools{display:grid;gap:12px}
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sw input{width:22px;height:22px;accent-color:var(--accent);margin:0}
table.truth{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed;font-size:14px}
table.truth th{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);text-align:center}
table.truth th[scope=row]{text-align:right;padding-right:4px;width:30%}
table.truth td{border:1.5px solid var(--faint);border-radius:8px;padding:10px 8px;text-align:center;vertical-align:middle;line-height:1.3;height:84px}
table.truth td.okc{background:var(--hit-soft)}
table.truth td.bad{background:var(--danger-soft)}
table.truth td.odd{background:var(--miss-soft)}
table.truth td.cur{border:3px solid var(--accent);font-weight:700}
.verdict{font-weight:600;margin:0;min-height:3em}
pre.code{margin:0;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--faint);padding:8px 12px;border-radius:6px;overflow-x:auto}
/* slider */
.slider{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 10px}
.slider label{font-weight:600}
.slider input[type=range]{flex:1;min-width:160px;accent-color:var(--accent);height:32px}
.slider output{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-width:2ch}
.counts{font-size:15px;margin:8px 0 0}
.agree{font-weight:600;margin:8px 0 0;padding:6px 10px;border-radius:6px;background:var(--hit-soft)}
/* check */
.qs{display:grid;gap:12px}
.q{border:1.5px solid var(--faint);border-radius:10px;padding:12px 14px;background:var(--surface)}
.q h3{font-size:16px;margin:0 0 8px;line-height:1.35}
.q summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:32px;display:list-item}
.q details p{margin:8px 0 0;font-size:15px}
.remember{font-size:24px;line-height:1.4;font-weight:600;margin:0 0 16px;padding:16px 18px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:6px}
footer.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;border-top:1px solid var(--faint);background:var(--bg)}
.nav button{min-height:46px;min-width:110px;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:16px}
#back{background:transparent;border:1.5px solid var(--line)}
#next{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-ink)}
.nav button:disabled{opacity:.4;cursor:default}
#count{font-size:14px;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){
  body{font-size:16px}
  .app{display:block;height:auto}
  header.top{padding:10px 16px}
  main#stage{overflow:visible}
  .step{grid-template-columns:1fr;grid-template-rows:none;gap:16px;padding:16px 16px 100px}
  .step > .text,.step > .predicts,.step > .figure{grid-column:auto;grid-row:auto}
  .step h2{font-size:24px}
  .def{font-size:18px}
  .figure{padding:10px}
  .chart,.pair .chart{max-height:none}
  footer.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:5}
  .nav button{min-width:96px}
  .remember{font-size:20px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#stage">Skip to the lesson</a>
<div class="app">
  <header class="top">
    <h1>Statecharts, step by step</h1>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  </header>
  <main id="stage" tabindex="-1"></main>
  <footer class="nav">
    <button id="back" type="button">&larr; Back</button>
    <div id="count" aria-hidden="true"></div>
    <button id="next" type="button">Next &rarr;</button>
  </footer>
</div>
<div id="announce" class="sr" aria-live="polite"></div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PROBE_MS = reduced ? 0 : 520;
let uid = 0;

/* ------------------------------------------------------------------
   A tiny statechart engine.
   Nodes: {id, label?, name?, children?, initial?, parallel?, on:{EV: targetId}}
   - Only nodes with a `label` are reported in traces (region nodes use `name`).
   - An event is offered to every current innermost state; each walks up
     its parents until one has an arrow for the event.
------------------------------------------------------------------- */
function Machine(def){
  const nodes = {}, parent = {}, order = [];
  (function walk(n, p){ nodes[n.id] = n; parent[n.id] = p; order.push(n.id); (n.children||[]).forEach(c => walk(c, n.id)); })(def, null);
  const isLeaf = id => !(nodes[id].children && nodes[id].children.length);
  const ancestors = id => { const a = []; let p = parent[id]; while (p) { a.push(p); p = parent[p]; } return a; };
  let active = new Set();
  function enter(id){
    active.add(id);
    const n = nodes[id];
    if (isLeaf(id)) return;
    if (n.parallel) n.children.forEach(c => enter(c.id));
    else enter(n.initial || n.children[0].id);
  }
  function reset(){ active = new Set(); enter(def.id); }
  function leaves(){ return order.filter(id => active.has(id) && isLeaf(id)); }
  function transition(src, tgt){
    const tAnc = ancestors(tgt);
    let lca = def.id;
    for (const a of ancestors(src)) { if (tAnc.includes(a)) { lca = a; break; } }
    const chain = [src, ...ancestors(src)];
    const exitRoot = chain[chain.indexOf(lca) - 1];
    for (const id of [...active]) if (id === exitRoot || ancestors(id).includes(exitRoot)) active.delete(id);
    const path = [tgt, ...tAnc];
    path.length = path.indexOf(lca);
    path.reverse();
    for (const id of path.slice(0, -1)) {
      active.add(id);
      const n = nodes[id];
      if (n.parallel) n.children.forEach(c => { if (!path.includes(c.id)) enter(c.id); });
    }
    enter(tgt);
  }
  function send(ev){
    const walks = [], claimed = new Map();
    for (const leaf of leaves()) {
      const steps = []; let s = leaf;
      while (s) {
        const n = nodes[s];
        if (claimed.has(s)) { steps.push({id:s, shared:true}); break; }
        if (n.on && n.on[ev] !== undefined) { steps.push({id:s, hit:true, target:n.on[ev]}); claimed.set(s, n.on[ev]); break; }
        if (n.label) steps.push({id:s, hit:false});
        s = parent[s];
      }
      const region = ancestors(leaf).map(a => nodes[a]).find(n => n.name);
      walks.push({leaf, steps, region: region ? region.name : null});
    }
    const fired = [];
    for (const [src, tgt] of claimed) { if (!active.has(src)) continue; transition(src, tgt); fired.push({src, tgt, ev}); }
    return {ev, walks, fired};
  }
  function describe(){
    const ls = leaves();
    let firstPath = null;
    return ls.map((id, i) => {
      const path = [...ancestors(id)].reverse().filter(a => nodes[a].label).map(a => nodes[a].label);
      if (i === 0) { firstPath = path; return [...path, nodes[id].label].join(' › '); }
      return nodes[id].label;
    }).join(', ');
  }
  reset();
  return {send, reset, describe, leaves, nodes, get active(){ return active; }, label: id => nodes[id].label || nodes[id].name || id};
}

/* ------------------------------------------------------------------
   SVG drawing helpers
------------------------------------------------------------------- */
function el(tag, attrs, parentEl, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parentEl) parentEl.appendChild(e);
  return e;
}
function clip(r, tx, ty){
  const cx = r.x + r.w/2, cy = r.y + r.h/2, dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return [cx, cy];
  const s = Math.min(dx ? (r.w/2)/Math.abs(dx) : Infinity, dy ? (r.h/2)/Math.abs(dy) : Infinity);
  return [cx + dx*s, cy + dy*s];
}
function newSvg(vb, alt){
  const id = 'c' + (++uid);
  const svg = el('svg', {viewBox:`0 0 ${vb[0]} ${vb[1]}`, class:'chart', role:'img', 'aria-label':alt||''});
  const defs = el('defs', {}, svg);
  [['', 'mk'], ['-hit','mk-hit'], ['-dup','mk-dup']].forEach(([suf, cls]) => {
    const m = el('marker', {id:id+'-m'+suf, viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'9', markerHeight:'9', markerUnits:'userSpaceOnUse', orient:'auto-start-reverse'}, defs);
    el('path', {d:'M0,0 L10,5 L0,10 z', class:cls}, m);
  });
  svg._id = id;
  return svg;
}
function drawLines(g, x, y, text, size){
  const lines = String(text).split('\n');
  const lh = size * 1.18;
  const t = el('text', {x, y: y - (lines.length-1)*lh/2, 'text-anchor':'middle', 'dominant-baseline':'central'}, g);
  lines.forEach((ln, i) => el('tspan', {x, dy: i ? lh : 0}, t, ln));
  return t;
}
function drawNote(svg, n){
  if (n.badge) {
    const g = el('g', {class:'badge'}, svg);
    el('circle', {cx:n.x, cy:n.y, r:9}, g);
    el('text', {x:n.x, y:n.y, 'text-anchor':'middle', 'dominant-baseline':'central'}, g, n.text);
    return g;
  }
  if (n.line) el('path', {d:n.line, class:'', stroke:'var(--muted)', 'stroke-width':1, fill:'none', 'stroke-dasharray':'2 2'}, svg);
  return el('text', {x:n.x, y:n.y, class:'note ' + (n.cls||''), 'text-anchor':n.anchor||'middle', 'dominant-baseline':'central'}, svg, n.text);
}
/* layout: {vb, alt, boxes:[{id,x,y,w,h,label}], regions:[{x,y,text}], dividers:[[x1,y1,x2,y2]],
            states:[{id,x,y,w,h,label,small}], arrows:[{from,ev,to?,d?,pts?,bend?,lx,ly,anchor,cls,inbox,label}],
            inits:[[x1,y1,x2,y2]], notes:[...] } */
function drawChart(layout){
  const svg = newSvg(layout.vb, layout.alt);
  const rects = {}, groups = {}, arrows = {};
  (layout.boxes||[]).forEach(b => {
    const g = el('g', {class:'bx', 'data-id':b.id}, svg);
    el('rect', {x:b.x, y:b.y, width:b.w, height:b.h, rx:16}, g);
    if (b.label) el('text', {x:b.x+12, y:b.y+20, 'dominant-baseline':'central'}, g, b.label);
    rects[b.id] = b; groups[b.id] = g;
  });
  (layout.dividers||[]).forEach(d => el('line', {x1:d[0], y1:d[1], x2:d[2], y2:d[3], class:'divider'}, svg));
  (layout.regions||[]).forEach(r => el('text', {x:r.x, y:r.y, class:'rg', 'dominant-baseline':'central'}, svg, r.text));
  (layout.states||[]).forEach(s => {
    const g = el('g', {class:'st' + (s.small ? ' small' : ''), 'data-id':s.id}, svg);
    el('rect', {x:s.x, y:s.y, width:s.w, height:s.h, rx:10}, g);
    drawLines(g, s.x + s.w/2, s.y + s.h/2, s.label, s.small ? 11 : 14);
    rects[s.id] = s; groups[s.id] = g;
  });
  (layout.arrows||[]).forEach(a => {
    const g = el('g', {class:'arr ' + (a.cls||'') + (a.inbox ? ' inbox' : '')}, svg);
    let d, lx, ly;
    if (a.d) { d = a.d; }
    else if (a.pts) { const p = a.pts; d = `M${p[0]},${p[1]} L${p[2]},${p[3]}`; lx = (p[0]+p[2])/2; ly = (p[1]+p[3])/2; }
    else {
      const A = rects[a.from], B = rects[a.to];
      const ac = [A.x+A.w/2, A.y+A.h/2], bc = [B.x+B.w/2, B.y+B.h/2];
      if (a.bend) {
        const mx = (ac[0]+bc[0])/2, my = (ac[1]+bc[1])/2, dx = bc[0]-ac[0], dy = bc[1]-ac[1], L = Math.hypot(dx, dy);
        const cx = mx - dy/L*a.bend, cy = my + dx/L*a.bend;
        const p1 = clip(A, cx, cy), p2 = clip(B, cx, cy);
        d = `M${p1[0]},${p1[1]} Q${cx},${cy} ${p2[0]},${p2[1]}`;
        lx = .25*p1[0] + .5*cx + .25*p2[0]; ly = .25*p1[1] + .5*cy + .25*p2[1];
      } else {
        const p1 = clip(A, bc[0], bc[1]), p2 = clip(B, ac[0], ac[1]);
        d = `M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`; lx = (p1[0]+p2[0])/2; ly = (p1[1]+p2[1])/2;
      }
    }
    const marker = a.cls && a.cls.includes('dup') ? '-dup' : '';
    const path = el('path', {d, 'marker-end':`url(#${svg._id}-m${marker})`}, g);
    const label = a.label != null ? a.label : a.ev;
    if (label) el('text', {x: a.lx != null ? a.lx : lx, y: a.ly != null ? a.ly : ly, 'text-anchor': a.anchor || 'middle', 'dominant-baseline':'central'}, g, label);
    g._path = path; g._marker = marker;
    if (a.from && a.ev) arrows[a.from + '|' + a.ev] = g;
  });
  (layout.inits||[]).forEach(p => {
    const g = el('g', {class:'init'}, svg);
    el('circle', {cx:p[0], cy:p[1], r:5}, g);
    el('path', {d:`M${p[0]},${p[1]} L${p[2]},${p[3]}`, 'marker-end':`url(#${svg._id}-m)`}, g);
  });
  (layout.notes||[]).forEach(n => drawNote(svg, n));
  return {
    svg, groups, arrows,
    setActive(set){ for (const id in groups) groups[id].classList.toggle('active', set.has(id)); },
    clearProbes(){
      for (const id in groups) groups[id].classList.remove('probe-miss', 'probe-hit');
      for (const k in arrows) { arrows[k].classList.remove('fired'); arrows[k]._path.setAttribute('marker-end', `url(#${svg._id}-m${arrows[k]._marker})`); }
    },
    probe(id, kind){ if (groups[id]) groups[id].classList.add(kind); },
    fire(src, ev){ const a = arrows[src + '|' + ev]; if (a) { a.classList.add('fired'); a._path.setAttribute('marker-end', `url(#${svg._id}-m-hit)`); } }
  };
}

   Live machine widget: chart + event buttons + visible trace
------------------------------------------------------------------- */
const timers = new Set();
function later(fn, ms){ const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers.clear(); }

function attachMachine(chart, machine, altBase){
  const update = () => {
    chart.setActive(machine.active);
    chart.svg.setAttribute('aria-label', altBase + ' Current state: ' + machine.describe() + '.');
  };
  update();
  return update;
}

function liveWidget(host, opts){
  const m = Machine(opts.def);
  const chart = drawChart(opts.layout);
  const box = document.createElement('div');
  box.className = 'live' + (opts.beside ? '' : ' side');
  host.appendChild(box);
  const wrap = document.createElement('div');
  wrap.appendChild(chart.svg);
  if (opts.beside) { const pr = document.createElement('div'); pr.className = 'pair'; pr.appendChild(wrap); const b2 = document.createElement('div'); b2.appendChild(opts.beside); pr.appendChild(b2); box.appendChild(pr); }
  else box.appendChild(wrap);
  const side = document.createElement('div');
  if (opts.beside) side.className = 'below';
  box.appendChild(side);
  const update = attachMachine(chart, m, opts.layout.alt);
  let pending = [];
  const ctrl = document.createElement('div');
  ctrl.className = 'ctrl'; ctrl.setAttribute('role', 'group'); ctrl.setAttribute('aria-label', 'Send an event');
  ctrl.innerHTML = '<span class="lbl">Send an event:</span>';
  opts.events.forEach(ev => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'evbtn'; b.textContent = ev;
    b.addEventListener('click', () => send(ev));
    ctrl.appendChild(b);
  });
  const rb = document.createElement('button');
  rb.type = 'button'; rb.className = 'ghost'; rb.textContent = 'Reset';
  rb.addEventListener('click', () => { flush(); m.reset(); chart.clearProbes(); update(); trace.innerHTML = hint; say('Reset. Current state: ' + m.describe()); if (opts.onChange) opts.onChange(m); });
  ctrl.appendChild(rb);
  side.appendChild(ctrl);
  const trace = document.createElement('div');
  trace.className = 'trace';
  const hint = `<h3>Trace: who handles the event?</h3><p class="hint">${opts.hint || 'Press an event button. The trace shows which state is asked, and which one handles it.'}</p><p class="res">Now in: ${m.describe()}</p>`;
  trace.innerHTML = hint;
  if (!opts.noTrace) side.appendChild(trace);

  function flush(){ pending.forEach(fn => fn()); pending = []; clearTimers(); }
  function send(ev){
    flush();
    chart.clearProbes();
    const r = m.send(ev);
    const maxLen = Math.max(...r.walks.map(w => w.steps.length));
    let html = `<h3>Trace: ${ev}</h3>`;
    r.walks.forEach(w => {
      if (r.walks.length > 1 && w.region) html += `<p class="rgh pending" data-s="0">${w.region} region</p>`;
      html += '<ol>';
      w.steps.forEach((s, i) => {
        const lab = m.label(s.id);
        const last = i === w.steps.length - 1;
        let cls, body;
        if (s.hit) { cls = 'hit'; body = `<span class="tag">handles it</span><b>${lab}</b> has a ${ev} arrow → go to <b>${m.label(s.target)}</b>`; }
        else if (s.shared) { cls = 'hit'; body = `<span class="tag">same</span>its parent <b>${lab}</b> is already handling it`; }
        else if (last) { cls = 'ign'; body = `<span class="tag">ignored</span><b>${lab}</b> has no ${ev} arrow, and nothing above it has one`; }
        else { cls = 'miss'; body = `<span class="tag">no arrow</span><b>${lab}</b> has no ${ev} arrow → ask its parent`; }
        if (s.shared) { cls = 'hit'; }
        html += `<li class="${cls} pending" data-s="${i}">${body}</li>`;
      });
      html += '</ol>';
    });
    html += `<p class="res pending" data-s="${maxLen}">Now in: ${m.describe()}</p>`;
    trace.innerHTML = html;
    const reveal = i => {
      trace.querySelectorAll(`[data-s="${i}"]`).forEach(x => x.classList.remove('pending'));
      r.walks.forEach(w => { const s = w.steps[i]; if (s) chart.probe(s.id, s.hit || s.shared ? 'probe-hit' : 'probe-miss'); });
    };
    const finish = () => {
      r.fired.forEach(f => chart.fire(f.src, f.ev));
      trace.querySelectorAll(`[data-s="${maxLen}"]`).forEach(x => x.classList.remove('pending'));
      update();
      if (opts.onChange) opts.onChange(m);
    };
    for (let i = 0; i < maxLen; i++) { const f = () => reveal(i); if (PROBE_MS) { later(f, i*PROBE_MS); pending.push(f); } else f(); }
    if (PROBE_MS) { later(() => { pending = []; finish(); }, maxLen*PROBE_MS); pending.push(finish); } else finish();
    const summary = r.fired.length ? r.fired.map(f => `${m.label(f.src)} handled ${ev}`).join('; ') : `No state handles ${ev}; ignored`;
    say(`${ev}: ${summary}. Now in ${m.describe()}.`);
  }
  return {m, chart, send, flush};
}

  <p>If one surprises you, go back to the step it came from: Back works at any time.</p>`,
  fig:h=>{ h.innerHTML = `<div class="qs">
    <div class="q"><h3>1. Four states all have the same ${K('EXIT')} arrow. What would a statechart do?</h3><details><summary>Show answer</summary><p>Put the four states in one parent box and draw a single EXIT arrow on the box. None of the four handles EXIT itself, so the event goes up to the parent, which does. (Steps 5–7.)</p></details></div>
    <div class="q"><h3>2. Why do two independent on/off features need four flat states but only two regions?</h3><details><summary>Show answer</summary><p>A flat state must name both features at once, so it needs one state per combination: 2 × 2 = 4. A statechart gives each feature its own region, each in one state at the same time, so it is two small machines of two states each. Each extra feature doubles the flat count but adds just one region. (Steps 8–12.)</p></details></div>
    <div class="q"><h3>3. Can a statechart do anything a state machine can't?</h3><details><summary>Show answer</summary><p>No. Flatten any statechart and you get an ordinary state machine with the same behaviour. What you gain is a smaller, more readable drawing, not new behaviour. (Steps 13–14.)</p></details></div></div>`; } },

{ kicker:'Remember', title:'The sentence to remember', last:true,
  body:()=>`<p class="remember">A statechart is a state machine that can nest states and run parts side by side, so shared behaviour is written once and independent features don't multiply.</p>
  <p>The coffee machine shows both: one ${K('POWER_OFF')} on the <b>on</b> box, and a frother region that adds two states instead of doubling the rest.</p>
  <p><button type="button" class="ghost" id="restart">Start again from step 1</button></p>`,
  fig:h=>{ const lay = frotherLayout(); lay.notes = [{x:268,y:290,text:'side by side',cls:'green'},{x:268,y:306,text:'(regions)',cls:'green'},{x:84,y:380,text:'written once',cls:'green'},{x:84,y:396,text:'(on the parent)',cls:'green'}]; lay.vb=[372,414];
    const c = drawChart(lay); h.appendChild(c.svg); } }
];

function pairUp(h, a, b){ const p = document.createElement('div'); p.className = 'pair'; p.style.alignItems = 'center'; [a, b].forEach(x => { const d = document.createElement('div'); d.appendChild(x); p.appendChild(d); }); h.appendChild(p); }
function boolFigure(h){
  h.innerHTML = `<div class="bools">
    <div class="switches" role="group" aria-label="Boolean variables">
      <label class="sw"><input type="checkbox" role="switch" id="bP"> isPlaying</label>
      <label class="sw"><input type="checkbox" role="switch" id="bQ" checked> isPaused</label>
    </div>
    <pre class="code" id="bCode" aria-hidden="true"></pre>
    <table class="truth"><caption class="sr">Every combination of the two booleans and what it means</caption>
      <thead><tr><td style="border:0;height:auto"></td><th scope="col">isPaused = false</th><th scope="col">isPaused = true</th></tr></thead>
      <tbody>
        <tr><th scope="row">isPlaying = false</th><td id="c00" class="odd">neither<br><small>not a state the player has</small></td><td id="c01" class="okc">paused ✓</td></tr>
        <tr><th scope="row">isPlaying = true</th><td id="c10" class="okc">playing ✓</td><td id="c11" class="bad">playing <i>and</i> paused<br><small>✗ impossible</small></td></tr>
      </tbody></table>
    <p class="verdict" id="bV" aria-live="polite"></p>
    <pre class="code">playback = "paused"   // one variable, one value:
                      // "both" can't be written</pre></div>`;
  const P = h.querySelector('#bP'), Q = h.querySelector('#bQ'), code = h.querySelector('#bCode'), v = h.querySelector('#bV');
  const msg = {'00':'Neither playing nor paused: the code allows it, but it means nothing we designed.', '01':'Paused: a real state.', '10':'Playing: a real state.', '11':'Both true: playing and paused at once. Nothing in the code stops this.'};
  function upd(){
    const k = (P.checked ? '1' : '0') + (Q.checked ? '1' : '0');
    code.textContent = `isPlaying = ${P.checked}\nisPaused  = ${Q.checked}`;
    ['00','01','10','11'].forEach(x => { const c = h.querySelector('#c' + x); c.classList.toggle('cur', x === k); if (x === k) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current'); });
    v.textContent = msg[k];
    v.style.color = k === '11' ? 'var(--danger)' : k === '00' ? 'var(--miss)' : 'var(--hit)';
  }
  P.addEventListener('change', upd); Q.addEventListener('change', upd); upd();
}
function flattenFigure(h){
  const pair = document.createElement('div'); pair.className = 'pair'; h.appendChild(pair);
  const ms = Machine(DEF.player), mf = Machine(DEF.playerFlat);
  const cs = drawChart(L.player), cf = drawChart(L.playerFlat);
  const us = attachMachine(cs, ms, L.player.alt), uf = attachMachine(cf, mf, L.playerFlat.alt);
  [cs, cf].forEach(c => { const d = document.createElement('div'); d.appendChild(c.svg); pair.appendChild(d); });
  const ctrl = document.createElement('div'); ctrl.className = 'ctrl'; ctrl.setAttribute('role', 'group'); ctrl.setAttribute('aria-label', 'Send an event to both machines');
  ctrl.innerHTML = '<span class="lbl">Send an event to both machines:</span>';
  const agree = document.createElement('p'); agree.className = 'agree'; agree.setAttribute('aria-live', 'polite');
  const show = () => {
    const a = ms.describe(), b = mf.describe().replace('\n', ', ');
    agree.textContent = `Statechart: ${a}.  Flat: ${b}.  ${a === b ? 'They agree.' : 'They differ!'}`;
  };
  ['PLAY','PAUSE','MUTE','UNMUTE'].forEach(ev => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'evbtn'; b.textContent = ev;
    b.addEventListener('click', () => {
      cs.clearProbes(); cf.clearProbes();
      const r1 = ms.send(ev), r2 = mf.send(ev);
      r1.fired.forEach(f => cs.fire(f.src, ev)); r2.fired.forEach(f => cf.fire(f.src, ev));
      us(); uf(); show();
    });
    ctrl.appendChild(b);
  });
  h.appendChild(ctrl); h.appendChild(agree); show();
}

/* ------------------------------------------------------------------
   Step rendering and navigation
------------------------------------------------------------------- */
const stage = document.getElementById('stage');
const back = document.getElementById('back'), next = document.getElementById('next');
const count = document.getElementById('count'), bar = document.getElementById('bar');
let cur = 0;

function render(i, announce){
  clearTimers();
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  const sec = document.createElement('section');
  sec.className = 'step';
  sec.setAttribute('aria-labelledby', 'stepTitle');
  const text = document.createElement('div'); text.className = 'text';
  text.innerHTML = `<p class="kicker">Step ${cur+1} · ${s.kicker}</p><h2 id="stepTitle" tabindex="-1">${s.title}</h2>${s.body()}`;
  const preds = document.createElement('div'); preds.className = 'predicts';
  (s.predict || []).forEach(p => {
    const fs = document.createElement('fieldset'); fs.className = 'predict';
    fs.innerHTML = `<legend>Predict: ${p.q}</legend><div class="opts ${p.col ? 'col' : ''}">` +
      p.options.map(([v, lab]) => `<label class="opt"><input type="radio" name="${p.key}" value="${v}" ${guesses[p.key] === v ? 'checked' : ''}><span>${lab}</span></label>`).join('') +
      `</div><p class="locked" aria-live="polite"></p>`;
    const locked = fs.querySelector('.locked');
    const showLocked = () => { locked.textContent = guesses[p.key] != null ? `Your guess is in. Press Reveal to check it.` : 'Pick one, then press Reveal.'; };
    fs.addEventListener('change', e => { guesses[p.key] = e.target.value; showLocked(); });
    showLocked();
    preds.appendChild(fs);
  });
  const fig = document.createElement('div'); fig.className = 'figure';
  sec.appendChild(text); sec.appendChild(fig); if (s.predict) sec.appendChild(preds);
  stage.innerHTML = ''; stage.appendChild(sec);
  if (s.fig) s.fig(fig);
  back.disabled = cur === 0;
  next.disabled = cur === STEPS.length - 1;
  next.innerHTML = (s.next || 'Next') + ' &rarr;';
  count.textContent = `${cur+1} / ${STEPS.length}`;
  bar.style.width = ((cur+1) / STEPS.length * 100) + '%';
  const rs = document.getElementById('restart'); if (rs) rs.addEventListener('click', () => go(0, true));
  if (location.hash !== '#' + (cur+1)) history.replaceState(null, '', '#' + (cur+1));
  stage.scrollTop = 0; window.scrollTo(0, 0);
  if (announce) say(`Step ${cur+1} of ${STEPS.length}: ${s.title}`);
  document.title = `Statecharts, Step by Step`;
}
function go(i, focusTitle){ render(i, true); if (focusTitle) document.getElementById('stepTitle').focus(); }
back.addEventListener('click', () => go(cur - 1));
next.addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowRight' && cur < STEPS.length - 1) { go(cur + 1); }
  if (e.key === 'ArrowLeft' && cur > 0) { go(cur - 1); }
});
window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) render(n - 1, true); });
const start = parseInt(location.hash.slice(1), 10);
render(start ? start - 1 : 0, false);
window.__steps = STEPS.length;
window.__go = i => render(i, false);
window.__engine = {Machine, DEF};
})();
</script>
